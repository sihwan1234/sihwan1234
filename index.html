            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            500: '#f43f5e',
                            600: '#e11d48',
                            700: '#be123c',
                        }
                    }
                }
            }
        }

        }

            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        .dark ::-webkit-scrollbar-thumb {

        }

            </button>

                📝 메뉴 관리 (<span id="menuCountBadge">0</span>)

        </div>

                        준비 완료
                    </span>
                    <h3 id="resultTitle" class="text-3xl sm:text-4xl font-black tracking-tight drop-shadow-sm">
                        오늘의 추천 점심은?

                    </p>

                    <!-- Search Map Buttons -->
                    <div id="mapButtons" class="hidden flex-wrap gap-2 justify-center pt-2">

                            📍 카카오맵 주변 검색

                        </button>

                </div>

            { id: 80, name: '크로플', category: '디저트/베이커리', desc: '크루아상과 와플의 유쾌한 만남' },

            { id: 81, name: '아메리카노', category: '음료', desc: '깔끔하게 리프레시하는 하루 한 잔' },
            { id: 82, name: '딸기라테', category: '음료', desc: '달콤한 딸기 과육 가득' },
            { id: 83, name: '밀크티', category: '음료', desc: '부드럽고 향긋한 차 향' },
            { id: 84, name: '레모네이드', category: '음료', desc: '톡 쏘는 상큼함' },
            { id: 85, name: '망고스무디', category: '음료', desc: '달달하고 시원한 망고 음료' }
        ];

        let menus = JSON.parse(localStorage.getItem('lunch_menus_v2')) || defaultMenus;
        let selectedCategory = '전체';
        let isSpinning = false;
        let lastSelectedMenu = null;

        // Dark mode setup
        const themeToggleBtn = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            themeIcon.textContent = '☀️';
        }

        themeToggleBtn.addEventListener('click', () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                themeIcon.textContent = '🌙';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                themeIcon.textContent = '☀️';
            }
        });

        function renderCategories() {
            const filterContainer = document.getElementById('categoryFilters');
            const categorySelect = document.getElementById('inputCategory');
            filterContainer.innerHTML = '';
            categorySelect.innerHTML = '';

            categories.forEach(cat => {
                // Render category badge
                const btn = document.createElement('button');
                btn.onclick = () => setCategory(cat.name);
                btn.className = cat.name === selectedCategory 
                    ? "px-3 py-1.5 rounded-xl text-xs font-bold bg-rose-500 text-white shadow-sm transition-all"
                    : "px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 transition-all";
                btn.innerHTML = `${cat.name} ${cat.icon}`;
                filterContainer.appendChild(btn);

                // Populate form select (excluding '전체')
                if (cat.name !== '전체') {
                    const option = document.createElement('option');
                    option.value = cat.name;
                    option.textContent = `${cat.name} ${cat.icon}`;
                    categorySelect.appendChild(option);
                }
            });

            updateFilteredCount();
        }

        function setCategory(catName) {
            selectedCategory = catName;
            renderCategories();
            if(!document.getElementById('sectionRoulette').classList.contains('hidden')) {
                drawRoulette();
            }
        }

        function getFilteredMenus() {
            if (selectedCategory === '전체') return menus;
            return menus.filter(m => m.category === selectedCategory);
        }

        function updateFilteredCount() {
            const count = getFilteredMenus().length;
            document.getElementById('filteredCount').textContent = `${count}개 메뉴 선택됨`;
            document.getElementById('menuCountBadge').textContent = menus.length;
        }

        function switchTab(tabName) {
            const sections = ['Recommend', 'Roulette', 'Manage'];
            
            sections.forEach(sec => {
                const secEl = document.getElementById('section' + sec);
                const tabBtn = document.getElementById('tab' + sec);
                if (sec.toLowerCase() === tabName.toLowerCase()) {
                    secEl.classList.remove('hidden');
                    tabBtn.className = "flex-1 py-2.5 text-xs sm:text-sm font-semibold rounded-xl bg-white dark:bg-slate-700 shadow-sm transition-all text-rose-600 dark:text-rose-400";
                    if(tabName === 'roulette') {
                        drawRoulette();
                    }
                } else {
                    secEl.classList.add('hidden');
                    tabBtn.className = "flex-1 py-2.5 text-xs sm:text-sm font-semibold rounded-xl text-slate-600 dark:text-slate-400 transition-all hover:text-slate-900 dark:hover:text-slate-200";
                }
            });
        }

        function getRandomMenu() {
            const filtered = getFilteredMenus();
            if (filtered.length === 0) {
                alert('선택한 카테고리에 등록된 메뉴가 없습니다. 메뉴를 등록해보세요!');
                return;
            }

            const titleEl = document.getElementById('resultTitle');
            const descEl = document.getElementById('resultDesc');
            const catEl = document.getElementById('resultCategory');
            const mapBtns = document.getElementById('mapButtons');

            mapBtns.classList.add('hidden');

            let counter = 0;
            const maxCount = 18;
            const interval = setInterval(() => {
                const randomItem = filtered[Math.floor(Math.random() * filtered.length)];
                titleEl.textContent = randomItem.name;
                descEl.textContent = randomItem.desc || '맛있는 점심 시간 보내세요!';
                catEl.textContent = randomItem.category;
                counter++;

                if (counter >= maxCount) {
                    clearInterval(interval);
                    lastSelectedMenu = randomItem.name;
                    mapBtns.classList.remove('hidden');
                    mapBtns.classList.add('flex');
                }
            }, 50);
        }

        function startCardFlipMode() {
            const filtered = getFilteredMenus();
            if (filtered.length < 3) {
                alert('카드 뒤집기를 진행하려면 최소 3개 이상의 메뉴가 필요합니다.');
                return;
            }

            const shuffled = [...filtered].sort(() => 0.5 - Math.random());
            const selectedCards = shuffled.slice(0, 3);

            const container = document.getElementById('cardFlipContainer');
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';
            container.classList.remove('hidden');

            selectedCards.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = "bg-slate-100 dark:bg-slate-700/60 rounded-2xl p-6 text-center cursor-pointer hover:bg-slate-200 dark:hover:bg-slate-600 transition-all flex flex-col items-center justify-center min-h-[160px] border border-slate-200 dark:border-slate-600 shadow-sm";
                card.innerHTML = `
                    <div class="text-3xl mb-2">🎁</div>
                    <div class="font-bold text-sm text-slate-700 dark:text-slate-200">카드 #${idx + 1}</div>
                    <div class="text-[11px] text-slate-400 mt-1">터치해서 오픈</div>
                `;
                
                card.onclick = () => {
                    lastSelectedMenu = item.name;
                    card.innerHTML = `
                        <span class="px-2 py-0.5 rounded bg-rose-500/10 text-rose-500 text-[10px] font-bold mb-1">${item.category}</span>
                        <div class="text-xl font-extrabold text-slate-900 dark:text-white mb-1">${item.name}</div>
                        <div class="text-xs text-slate-500 dark:text-slate-300 mb-3">${item.desc || ''}</div>
                        <div class="flex gap-1 justify-center">
                            <button onclick="event.stopPropagation(); searchNearby('kakao')" class="px-2 py-1 bg-yellow-400 text-slate-900 text-[10px] font-bold rounded">카카오맵</button>
                            <button onclick="event.stopPropagation(); searchNearby('naver')" class="px-2 py-1 bg-emerald-500 text-white text-[10px] font-bold rounded">네이버지도</button>
                        </div>
                    `;
                    card.className = "bg-rose-50 dark:bg-rose-900/30 border-2 border-rose-500 rounded-2xl p-4 text-center flex flex-col items-center justify-center min-h-[160px] shadow-md transition-all";
                };
                grid.appendChild(card);
            });
        }

        function closeCardFlip() {
            document.getElementById('cardFlipContainer').classList.add('hidden');
        }

        let rouletteAngle = 0;
        const colors = [
            '#f43f5e', '#fb923c', '#facc15', '#4ade80', '#38bdf8', 
            '#818cf8', '#e879f9', '#fb7185', '#34d399', '#a78bfa'
        ];

        function drawRoulette() {
            const canvas = document.getElementById('rouletteCanvas');
            const ctx = canvas.getContext('2d');
            const filtered = getFilteredMenus();
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2 - 10;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (filtered.length === 0) {
                ctx.font = '14px Pretendard';
                ctx.fillStyle = '#94a3b8';
                ctx.textAlign = 'center';
                ctx.fillText('선택한 메뉴가 없습니다', centerX, centerY);
                return;
            }

            const arcSize = (2 * Math.PI) / filtered.length;

            filtered.forEach((item, i) => {
                const angle = rouletteAngle + i * arcSize;
                ctx.beginPath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, angle, angle + arcSize);
                ctx.lineTo(centerX, centerY);
                ctx.fill();
                ctx.save();

                // Text rendering
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#ffffff';
                ctx.font = filtered.length > 25 ? 'bold 10px Pretendard' : 'bold 12px Pretendard';
                ctx.fillText(item.name.length > 7 ? item.name.substring(0, 7) + '..' : item.name, radius - 15, 4);
                ctx.restore();
            });
        }

        function spinRoulette() {
            if (isSpinning) return;
            const filtered = getFilteredMenus();
            if (filtered.length === 0) {
                alert('룰렛에 사용할 메뉴가 없습니다.');
                return;
            }

            isSpinning = true;
            document.getElementById('rouletteResult').textContent = '';
            document.getElementById('rouletteMapButtons').classList.add('hidden');
            document.getElementById('spinBtn').disabled = true;

            const spinAngle = Math.random() * 2000 + 3500;
            const duration = 3200;
            const startTimestamp = performance.now();
            const initialAngle = rouletteAngle;

            function animateSpin(currentTime) {
                const elapsed = currentTime - startTimestamp;
                const progress = Math.min(elapsed / duration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 4);

                rouletteAngle = initialAngle + (spinAngle * easeOut);
                drawRoulette();

                if (progress < 1) {
                    requestAnimationFrame(animateSpin);
                } else {
                    isSpinning = false;
                    document.getElementById('spinBtn').disabled = false;
                    
                    const arcSize = (2 * Math.PI) / filtered.length;
                    const normalizedAngle = (2 * Math.PI - (rouletteAngle % (2 * Math.PI))) % (2 * Math.PI);
                    const winningIndex = Math.floor(normalizedAngle / arcSize);
                    const winner = filtered[winningIndex];

                    lastSelectedMenu = winner.name;
                    document.getElementById('rouletteResult').textContent = `🎉 당첨: ${winner.name} (${winner.category})`;
                    const rMapBtns = document.getElementById('rouletteMapButtons');
                    rMapBtns.classList.remove('hidden');
                    rMapBtns.classList.add('flex');
                }
            }

            requestAnimationFrame(animateSpin);
        }

        function searchNearby(platform) {
            if (!lastSelectedMenu) return;
            const query = encodeURIComponent(`주변 ${lastSelectedMenu} 맛집`);
            if (platform === 'kakao') {
                window.open(`https://map.kakao.com/?q=${query}`, '_blank');
            } else if (platform === 'naver') {
                window.open(`https://map.naver.com/v5/search/${query}`, '_blank');
            }
        }

        function renderMenuList() {
            const container = document.getElementById('menuListContainer');
            container.innerHTML = '';

            if (menus.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400 text-center py-6">등록된 메뉴가 없습니다.</p>';
                return;
            }

            menus.forEach((item) => {
                const card = document.createElement('div');
                card.className = "flex items-center justify-between p-3 rounded-2xl bg-slate-50 dark:bg-slate-700/50 border border-slate-100 dark:border-slate-700 hover:border-slate-300 transition-all";
                card.innerHTML = `
                    <div class="flex-1 pr-2">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-xs sm:text-sm text-slate-800 dark:text-slate-100">${item.name}</span>
                            <span class="px-2 py-0.5 rounded-md bg-slate-200 dark:bg-slate-600 text-slate-600 dark:text-slate-300 text-[10px] font-semibold">${item.category}</span>
                        </div>
                        <div class="text-[11px] text-slate-400 mt-0.5">${item.desc || '설명 없음'}</div>
                    </div>
                    <button onclick="deleteMenu(${item.id})" class="p-1.5 text-slate-400 hover:text-rose-500 transition-colors" title="삭제">
                        🗑️
                    </button>
                `;
                container.appendChild(card);
            });

            updateFilteredCount();
        }

        function addCustomMenu(e) {
            e.preventDefault();
            const name = document.getElementById('inputName').value.trim();
            const category = document.getElementById('inputCategory').value;
            const desc = document.getElementById('inputDesc').value.trim();

            if (!name) return;

            const newItem = {
                id: Date.now(),
                name,
                category,
                desc
            };

            menus.unshift(newItem);
            localStorage.setItem('lunch_menus_v2', JSON.stringify(menus));

            document.getElementById('addMenuForm').reset();
            renderMenuList();
            if(!document.getElementById('sectionRoulette').classList.contains('hidden')) {
                drawRoulette();
            }
            alert(`"${name}" 메뉴가 등록되었습니다!`);
        }

        function deleteMenu(id) {
            menus = menus.filter(m => m.id !== id);
            localStorage.setItem('lunch_menus_v2', JSON.stringify(menus));
            renderMenuList();
            if(!document.getElementById('sectionRoulette').classList.contains('hidden')) {
                drawRoulette();
            }
        }

        function resetDefaultMenus() {
            if (confirm('기본 85개 메뉴 세트로 전체 초기화하시겠습니까?')) {
                menus = [...defaultMenus];
                localStorage.setItem('lunch_menus_v2', JSON.stringify(menus));
                renderMenuList();
                if(!document.getElementById('sectionRoulette').classList.contains('hidden')) {
                    drawRoulette();
                }
            }
        }

        window.onload = function() {
            renderCategories();
            renderMenuList();
            drawRoulette();
        };
    </script>
